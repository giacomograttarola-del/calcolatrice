<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="js/calc.js"></script>
    <link rel="stylesheet" href="style/style.css">
    
    <title>calcolatrice</title>
</head>
<body>
    
    <input type="number" name="val1" id="val1">
    <input type="number" name="val2" id="val2">

    <button class="op" id="1" onclick="calcola(this.id)">+</button>
    <button class="op" id="2" onclick="calcola(this.id)">*</button>
    <button class="op" id="3" onclick="calcola(this.id)">-</button>
    <button class="op" id="4" onclick="calcola(this.id)">/</button>

    <button class="op" id="clr" onclick="resetta()">clr</button>

    <p id="result"></p>

</body>
</html>
